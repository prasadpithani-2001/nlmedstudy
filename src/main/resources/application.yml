
server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 600MB
      max-request-size: 600MB

  # Default database for local development
  datasource:
    url: "jdbc:h2:file:./data/studydesk;MODE=MySQL;AUTO_SERVER=TRUE"
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

# Recordings and uploaded files
recordings:
  dir: ${RECORDINGS_DIR:uploads/recordings}
  quota-gb: 20

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  support-email: ${APP_SUPPORT_EMAIL:support@example.com}
  staff-notify-email: ${APP_STAFF_NOTIFY_EMAIL:}
  mail:
    from: "NLMed Study <no-reply@nmedstudy.com>"

sms:
  provider: ${SMS_PROVIDER:none}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_FROM:}

---
# Production database: TiDB Cloud
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: "jdbc:mysql://${TIDB_HOST}:4000/studydesk?sslMode=VERIFY_IDENTITY"
    username: ${TIDB_USER}
    password: ${TIDB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
